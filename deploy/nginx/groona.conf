
server {
  listen 80;
  server_name www.YOUR_DOMAIN.kr api.YOUR_DOMAIN.kr YOUR_DOMAIN.kr;
  return 301 https://www.YOUR_DOMAIN.kr$request_uri;
}
server {
  listen 443 ssl http2;
  server_name www.YOUR_DOMAIN.kr;
  # ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN.kr/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.kr/privkey.pem;
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    alias /var/www/groona/.well-known/apple-app-site-association;
  }
  location = /.well-known/assetlinks.json {
    default_type application/json;
    alias /var/www/groona/.well-known/assetlinks.json;
  }
  location / { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
server {
  listen 443 ssl http2;
  server_name api.YOUR_DOMAIN.kr;
  location / { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
}
